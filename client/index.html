    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;800&family=Lora:wght@400;500;600&display=optional" as="style">

    <!-- Open Graph. Per-route values are patched at runtime by RouteSeo. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SOULCHAIN">
    <meta property="og:locale" content="en">
    <meta property="og:url" content="https://soulchain.net/">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:url" content="https://soulchain.net/">
    <meta name="twitter:title" content="Peer Learning Platform for Founders &amp; Leaders | SOULCHAIN">
    <meta name="twitter:description" content="SOULCHAIN is a peer learning platform pairing a daily insight with a peer network matched on how you think. For founders, community builders and teams.">
    <meta name="twitter:image" content="https://soulchain.net/assets/logo.png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://soulchain.net/#organization",
          "name": "SOULCHAIN",
          "url": "https://soulchain.net/",
          "logo": "https://soulchain.net/assets/logo.png",
          "sameAs": [
            "https://www.instagram.com/epiminded.ai/",
            "https://www.linkedin.com/company/epineonn"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://soulchain.net/#website",
          "url": "https://soulchain.net/",
          "name": "SOULCHAIN",
          "inLanguage": "en",
          "publisher": { "@id": "https://soulchain.net/#organization" }
        }
      ]
    }
    </script>

    <!-- Visitors who chose French: keep prerendered English hidden until the app
         has switched language (see LanguageContext). Revealed after 4s regardless,
         so a failed script can never leave the page blank. -->
    <script>try{if(localStorage.getItem("epiminded_language")==="fr"){document.documentElement.setAttribute("data-lang-pending","");setTimeout(function(){document.documentElement.removeAttribute("data-lang-pending")},4000)}}catch(e){}</script>
    <style>html[data-lang-pending] #root{visibility:hidden}</style>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B6FFYKXB93"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-B6FFYKXB93');
    </script>
  </head>

  <body>
    <!--
      Prerendered markup ships with framer-motion's initial style (opacity:0)
      and Reveal's pre-animation classes, both of which are cleared on
      hydration. Without JS nothing clears them, so the text would be present
      but invisible. This reveals it for that case only — same content, same
      markup, no bot-specific branch.
    -->
    <noscript>
      <style>
        #root [style*="opacity:0"] {
          opacity: 1 !important;
          transform: none !important;
        }
        #root .reveal-motion {
          opacity: 1 !important;
          filter: none !important;
          transform: none !important;
        }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
