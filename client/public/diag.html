<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rendering diagnostic</title>
<style>
  body{margin:0;padding:16px;background:#111;color:#eee;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h1{font-size:17px;margin:0 0 4px}
  p.sub{margin:0 0 14px;color:#999;font-size:13px}
  pre{white-space:pre-wrap;word-wrap:break-word;background:#000;border:1px solid #333;
      border-radius:8px;padding:12px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#ddd}
  button{-webkit-appearance:none;appearance:none;border:0;border-radius:8px;background:#c8a54a;
         color:#111;font-size:16px;font-weight:600;padding:13px 18px;width:100%;margin-bottom:12px}
  /* Visible on purpose: iOS throttles scripts in offscreen iframes, which made
     the first version report "no JS" for every iPhone. */
  iframe{width:100%;height:320px;border:1px solid #333;border-radius:8px;background:#000;display:block;margin-bottom:12px}
  .lbl{color:#999;font-size:12px;margin:0 0 6px}
</style>
</head>
<body>
<h1>Rendering diagnostic</h1>
<p class="sub">Leave this page open for 15 seconds, then tap Copy result.</p>
<button id="copy" type="button">Copy result</button>
<p class="lbl">Live test frame (the real page):</p>
<iframe id="f" src="/enterprise" title="test frame"></iframe>
<pre id="out">Running…</pre>
<script>
/* ES5 on purpose. Captures what the page does on THIS device: whether its
   JavaScript boots, and what it throws if it does not. */
(function () {
  var L = [], errs = [], out = document.getElementById('out'), f = document.getElementById('f');
  function add(k, v) { L.push(k + ': ' + v); }
  function render() { out.innerHTML = L.join('\n').replace(/</g, '&lt;'); }

  add('ua', navigator.userAgent);
  add('screen', screen.width + 'x' + screen.height + ' dpr' + (window.devicePixelRatio || 1));
  add('date', new Date().toISOString());

  var feats = [], S = window.CSS && CSS.supports ? CSS.supports.bind(CSS) : function () { return false; };
  function sup(l, c) { feats.push(l + '=' + (c ? 'y' : 'n')); }
  sup('webgl', (function () {
    try { var c = document.createElement('canvas');
          return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; }
  })());
  sup('IntersectionObserver', typeof IntersectionObserver !== 'undefined');
  sup('ResizeObserver', typeof ResizeObserver !== 'undefined');
  sup('modules', 'noModule' in document.createElement('script'));
  sup('dynamicImport', (function () { try { new Function('return import("data:text/javascript,")'); return true; } catch (e) { return false; } })());
  var st = true; try { window.localStorage.getItem('x'); } catch (e) { st = false; }
  sup('localStorage', st);
  sup('reducedMotion', !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches));
  add('env', feats.join(' '));
  render();

  function hook() {
    var w;
    try { w = f.contentWindow; } catch (e) { return; }
    if (!w || w.__hooked) return;
    try {
      w.__hooked = 1;
      w.addEventListener('error', function (e) {
        var m = e.message || (e.error && e.error.message) || 'resource error';
        var src = (e.target && (e.target.src || e.target.href)) || e.filename || '';
        errs.push(m + (src ? ' @ ' + String(src).replace(location.origin, '') : ''));
      }, true);
      w.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        errs.push('promise: ' + ((r && (r.message || r)) || 'unknown'));
      });
    } catch (e) { /* cross-origin or not ready */ }
  }
  var hookTimer = setInterval(hook, 60);
  setTimeout(function () { clearInterval(hookTimer); }, 14000);

  function snap(label) {
    var line = label + ' ';
    try {
      var d = f.contentDocument, w = f.contentWindow;
      if (!d || !d.body) { add(line, 'no document'); render(); return; }
      var root = d.getElementById('root');
      var all = root ? root.getElementsByTagName('*') : [];
      var hidden = 0, h1 = d.getElementsByTagName('h1')[0], h1op = 'n/a';
      for (var i = 0; i < all.length; i++) {
        var o = w.getComputedStyle(all[i]).opacity;
        if (o === '0') hidden++;
      }
      if (h1) h1op = w.getComputedStyle(h1).opacity;
      add(line, 'html.class="' + (d.documentElement.className || '') + '"' +
                ' sheets=' + d.styleSheets.length +
                ' rootEls=' + all.length +
                ' opacity0=' + hidden +
                ' h1opacity=' + h1op +
                ' bodyBg=' + w.getComputedStyle(d.body).backgroundColor);
    } catch (e) { add(line, 'ERROR ' + e.name + ' ' + e.message); }
    render();
  }

  setTimeout(function () { snap('t=2s '); }, 2000);
  setTimeout(function () { snap('t=6s '); }, 6000);
  setTimeout(function () {
    snap('t=14s');
    add('js errors(' + errs.length + ')', errs.length ? '\n  ' + errs.slice(0, 8).join('\n  ') : 'none captured');
    var d; try { d = f.contentDocument; } catch (e) {}
    if (d) {
      add('VERDICT', (d.documentElement.className.indexOf('dark') >= 0)
        ? 'JS BOOTED (app hydrated)'
        : 'JS DID NOT BOOT (page stays as prerendered, content hidden)');
    }
    render();
  }, 14000);

  document.getElementById('copy').onclick = function () {
    var t = L.join('\n'), b = document.getElementById('copy');
    function select() {
      var r = document.createRange(); r.selectNodeContents(out);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      b.innerHTML = 'Selected — now tap Copy';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { b.innerHTML = 'Copied'; }, select);
    } else { select(); }
  };
})();
</script>
</body>
</html>
